<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Latar Belakang -->
  <rect width="500" height="500" rx="100" fill="#0b0c10"/>
  
  <!-- Efek Neon Outer Ring -->
  <rect x="25" y="25" width="450" height="450" rx="80" fill="none" stroke="#45a29e" stroke-width="6" opacity="0.4"/>
  <rect x="15" y="15" width="470" height="470" rx="90" fill="none" stroke="#66fcf1" stroke-width="4"/>

  <!-- Buah Apel Neon -->
  <g transform="translate(320, 110)">
    <!-- Daun Apel -->
    <path d="M 0 -15 C 10 -35 30 -35 35 -20 C 20 0 0 -10 0 -15 Z" fill="#66fcf1"/>
    <!-- Badan Apel -->
    <path d="M -40 0 C -70 -20 -80 40 -50 70 C -30 90 0 85 0 85 C 0 85 30 90 50 70 C 80 40 70 -20 40 0 C 25 10 -25 10 -40 0 Z" fill="#ff2e63"/>
  </g>

  <!-- Tubuh Ular (Gaya Grid/Pixel Digital) -->
  <path d="M 90 320 L 170 320 L 170 240 L 250 240 L 250 160 L 330 160" 
        fill="none" stroke="#45a29e" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Kepala Ular -->
  <g transform="translate(90, 320)">
    <rect x="-30" y="-30" width="60" height="60" rx="15" fill="#66fcf1"/>
    <!-- Mata Ular -->
    <circle cx="-10" cy="-10" r="6" fill="#0b0c10"/>
    <circle cx="-10" cy="10" r="6" fill="#0b0c10"/>
    <!-- Lidah -->
    <path d="M -30 0 L -50 -10 M -30 0 L -50 10" stroke="#ff2e63" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Teks Judul Game -->
  <text x="250" y="410" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="42" fill="#66fcf1" letter-spacing="3">
    SNAKE
  </text>
  <text x="250" y="450" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="24" fill="#45a29e" letter-spacing="6">
    ARENA
  </text>
</svg>
